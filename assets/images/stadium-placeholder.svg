<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="stadiumDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020914"/>
      <stop offset="50%" stop-color="#071A36"/>
      <stop offset="100%" stop-color="#0A1E3D"/>
    </linearGradient>
    <linearGradient id="stadiumGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#C8A44D"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#stadiumDark)"/>

  <!-- Stadium Silhouette Arc -->
  <path d="M 50 320 C 50 150 200 80 300 80 C 400 80 550 150 550 320 Z" fill="none" stroke="url(#stadiumGlow)" stroke-width="4"/>
  <path d="M 90 320 C 90 190 210 130 300 130 C 390 130 510 190 510 320 Z" fill="none" stroke="#1E3A8A" stroke-width="2"/>

  <!-- Halo Scoreboard ring -->
  <ellipse cx="300" cy="180" rx="140" ry="25" fill="none" stroke="#38BDF8" stroke-width="6" opacity="0.8"/>
  <ellipse cx="300" cy="180" rx="140" ry="25" fill="none" stroke="#FFFFFF" stroke-dasharray="8,6" stroke-width="2"/>

  <!-- Pitch at bottom -->
  <polygon points="120,320 480,320 540,380 60,380" fill="#15803D" stroke="#4ADE80" stroke-width="2"/>
  <line x1="300" y1="320" x2="300" y2="380" stroke="#FFFFFF" stroke-width="2"/>
  <ellipse cx="300" cy="350" rx="40" ry="12" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Floodlights beams -->
  <polygon points="100,60 0,380 180,380" fill="#38BDF8" opacity="0.08"/>
  <polygon points="500,60 420,380 600,380" fill="#38BDF8" opacity="0.08"/>

  <text x="300" y="240" fill="#FCE08B" font-family="'Barlow Condensed', sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="3">ESTADIO SANTIAGO BERNABÉU</text>
  <text x="300" y="265" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">MADRID, ESPAÑA • 84,700 SEATS</text>
</svg>
