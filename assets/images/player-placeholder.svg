<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D5C"/>
      <stop offset="50%" stop-color="#071A36"/>
      <stop offset="100%" stop-color="#020914"/>
    </linearGradient>
    <linearGradient id="goldPlayer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCE08B"/>
      <stop offset="100%" stop-color="#C8A44D"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle pitch arc circles in background -->
  <circle cx="200" cy="250" r="160" fill="none" stroke="#1E3A8A" stroke-width="2" opacity="0.3"/>
  <circle cx="200" cy="250" r="80" fill="none" stroke="#C8A44D" stroke-width="1.5" opacity="0.2"/>

  <!-- Athletic Player Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="160" r="48" fill="#FFFFFF" opacity="0.85"/>
  <!-- Hair line / modern cut -->
  <path d="M 160 150 C 160 120 240 120 240 150 C 230 130 170 130 160 150 Z" fill="#C8A44D"/>
  
  <!-- Neck -->
  <rect x="186" y="200" width="28" height="25" fill="#FFFFFF" opacity="0.85"/>

  <!-- Shoulders & Jersey Torso -->
  <path d="M 110 320 C 110 245 155 220 200 220 C 245 220 290 245 290 320 L 290 480 L 110 480 Z" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Gold V-Neck Collar & Trim -->
  <polygon points="200,265 178,220 222,220" fill="url(#goldPlayer)"/>
  
  <!-- Real Madrid Crest on Left Chest -->
  <circle cx="160" cy="280" r="14" fill="#071A36" stroke="url(#goldPlayer)" stroke-width="2"/>
  <text x="160" y="284" fill="#FCE08B" font-family="'Arial Black', sans-serif" font-size="8" text-anchor="middle">RM</text>

  <!-- Real Madrid Text Watermark on lower jersey -->
  <text x="200" y="420" fill="#071A36" font-family="'Arial Black', sans-serif" font-size="18" text-anchor="middle" letter-spacing="4" opacity="0.6">MADRID</text>
  
  <!-- Crown Accent on top -->
  <path d="M 185 105 L 175 90 L 190 97 L 200 85 L 210 97 L 225 90 L 215 105 Z" fill="url(#goldPlayer)"/>
</svg>
