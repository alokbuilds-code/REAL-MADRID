<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="silverLg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCE08B"/>
      <stop offset="50%" stop-color="#C8A44D"/>
      <stop offset="100%" stop-color="#9C7927"/>
    </linearGradient>
  </defs>

  <!-- Pedestal -->
  <rect x="55" y="210" width="90" height="20" rx="3" fill="#0B132B" stroke="url(#goldRibbon)" stroke-width="2"/>
  <rect x="65" y="195" width="70" height="15" fill="url(#silverLg)"/>
  
  <!-- Base Bowl/Foot -->
  <path d="M 80 195 L 88 150 L 112 150 L 120 195 Z" fill="url(#silverLg)" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="100" cy="150" rx="24" ry="6" fill="#64748B"/>

  <!-- Upper Chalice -->
  <path d="M 76 150 C 65 110 55 70 50 48 L 150 48 C 145 70 135 110 124 150 Z" 
        fill="url(#silverLg)" stroke="#334155" stroke-width="2"/>
  
  <!-- Top Rim -->
  <ellipse cx="100" cy="48" rx="50" ry="10" fill="#CBD5E1" stroke="#334155" stroke-width="2"/>
  <ellipse cx="100" cy="46" rx="46" ry="8" fill="#1E293B"/>

  <!-- Gold Laurel Ribbon Around Midriff -->
  <path d="M 60 90 C 80 102 120 102 140 90 L 138 106 C 118 118 82 118 62 106 Z" fill="url(#goldRibbon)" stroke="#6C4D0A" stroke-width="1"/>
  
  <!-- Emblem: 36 Titles Badge -->
  <circle cx="100" cy="115" r="13" fill="#071A36" stroke="url(#goldRibbon)" stroke-width="1.5"/>
  <text x="100" y="119" fill="#FCE08B" font-family="'Arial Black', sans-serif" font-size="9" text-anchor="middle" font-weight="900">36</text>
  <text x="100" y="125" fill="#CBD5E1" font-family="sans-serif" font-size="5" text-anchor="middle" letter-spacing="0.5">TITLES</text>
</svg>
