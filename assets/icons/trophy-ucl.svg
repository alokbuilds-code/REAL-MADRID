<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="silverDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCE08B"/>
      <stop offset="100%" stop-color="#C8A44D"/>
    </linearGradient>
  </defs>

  <!-- Base / Plinth -->
  <rect x="70" y="215" width="60" height="15" rx="3" fill="url(#silverDark)"/>
  <rect x="60" y="228" width="80" height="10" rx="2" fill="#1E293B" stroke="url(#goldAcc)" stroke-width="1.5"/>

  <!-- Stem & Base connector -->
  <path d="M 85 215 L 85 185 C 85 175 92 170 100 170 C 108 170 115 175 115 185 L 115 215 Z" fill="url(#silverGrad)"/>
  <ellipse cx="100" cy="180" rx="18" ry="5" fill="url(#silverDark)"/>

  <!-- Main Cup Body -->
  <path d="M 60 70 C 60 145 78 175 100 175 C 122 175 140 145 140 70 L 138 45 C 138 40 62 40 62 45 Z" 
        fill="url(#silverGrad)" stroke="#475569" stroke-width="2"/>
  
  <!-- Cup Rim -->
  <ellipse cx="100" cy="45" rx="38" ry="8" fill="url(#silverDark)" stroke="#CBD5E1" stroke-width="2"/>
  <ellipse cx="100" cy="43" rx="35" ry="6" fill="#1E293B"/>

  <!-- Iconic Large Ears / Handles (Las Orejas) -->
  <!-- Left Handle -->
  <path d="M 64 60 C 25 45 10 95 18 135 C 24 165 45 160 62 145 C 67 140 64 130 58 134 C 44 145 32 142 28 125 C 22 98 34 62 65 72 Z" 
        fill="url(#silverGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Right Handle -->
  <path d="M 136 60 C 175 45 190 95 182 135 C 176 165 155 160 138 145 C 133 140 136 130 142 134 C 156 145 168 142 172 125 C 178 98 166 62 135 72 Z" 
        fill="url(#silverGrad)" stroke="#334155" stroke-width="2"/>

  <!-- UCL Starball Engraving on Cup Center -->
  <circle cx="100" cy="100" r="14" fill="#071A36" stroke="url(#goldAcc)" stroke-width="1.5"/>
  <polygon points="100,89 103,96 111,97 105,102 107,110 100,105 93,110 95,102 89,97 97,96" fill="url(#goldAcc)"/>

  <!-- Badge 15 text (La Decimoquinta) -->
  <rect x="86" y="122" width="28" height="14" rx="4" fill="#071A36" stroke="url(#goldAcc)" stroke-width="1"/>
  <text x="100" y="132" fill="#FCE08B" font-family="'Arial Black', sans-serif" font-size="9" text-anchor="middle" font-weight="900">15</text>
</svg>
