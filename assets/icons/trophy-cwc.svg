<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cwcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A1"/>
      <stop offset="35%" stop-color="#E5B942"/>
      <stop offset="70%" stop-color="#C89727"/>
      <stop offset="100%" stop-color="#8C6514"/>
    </linearGradient>
    <linearGradient id="cwcSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Heavy dark pedestal -->
  <polygon points="65,225 135,225 145,232 55,232" fill="#0A1128"/>
  <rect x="65" y="200" width="70" height="25" fill="#0F172A" stroke="url(#cwcGold)" stroke-width="1.5"/>
  <text x="100" y="214" fill="#FCE08B" font-family="'Arial Black', sans-serif" font-size="7" text-anchor="middle">FIFA CLUB</text>
  <text x="100" y="221" fill="#FCE08B" font-family="'Arial Black', sans-serif" font-size="6" text-anchor="middle">WORLD CUP: 8x</text>

  <!-- Six Curved Prongs / Pillars lifting the globe -->
  <path d="M 75 200 C 65 140 70 85 92 65" fill="none" stroke="url(#cwcGold)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 85 200 C 78 140 82 85 95 65" fill="none" stroke="url(#cwcGold)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 125 200 C 135 140 130 85 108 65" fill="none" stroke="url(#cwcGold)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 115 200 C 122 140 118 85 105 65" fill="none" stroke="url(#cwcGold)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Top Floating Football Globe -->
  <circle cx="100" cy="55" r="24" fill="url(#cwcSilver)" stroke="url(#cwcGold)" stroke-width="2"/>
  <!-- Football pentagons -->
  <polygon points="100,43 107,48 104,56 96,56 93,48" fill="#1E293B"/>
  <polygon points="118,52 121,58 116,63 111,60 112,54" fill="#1E293B"/>
  <polygon points="82,52 88,54 89,60 84,63 79,58" fill="#1E293B"/>
  <polygon points="100,68 106,64 104,73 96,73 94,64" fill="#1E293B"/>
</svg>
